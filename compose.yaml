services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: tournament_dev
      POSTGRES_USER: tournament_dev
      POSTGRES_PASSWORD: local-only-not-a-deployment-secret
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament_dev -d tournament_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
