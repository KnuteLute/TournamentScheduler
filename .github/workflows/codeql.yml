name: CodeQL

on:
  pull_request:
    branches:
      - upgrade/tournament-v2
  push:
    branches:
      - upgrade/tournament-v2
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # github/codeql-action v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # github/codeql-action v4.39.0
        with:
          upload: ${{ github.event_name != 'pull_request' }}
