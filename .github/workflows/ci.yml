name: CI

on:
  pull_request:
    branches:
      - upgrade/tournament-v2
      - main
  push:
    branches:
      - upgrade/tournament-v2
      - main
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
      - name: Install locked workspace dependencies
        run: npm ci
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run test:unit

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run contract:check

  integration-postgres:
    name: integration-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: tournament_test
          POSTGRES_USER: tournament_test
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournament_test -d tournament_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      POSTGRES_URL: postgres://tournament_test:disposable-ci-only@localhost:5432/tournament_test
      POSTGRES_TEST_DATABASE_URL: postgres://tournament_test:disposable-ci-only@localhost:5432/tournament_test
      RATE_LIMIT_TEST_DATABASE_URL: postgres://tournament_test:disposable-ci-only@localhost:5432/tournament_test
      TEST_DATABASE_NAME: tournament_test
      TEST_API_ORIGIN: http://127.0.0.1:4173
      E2E_BASE_URL: http://127.0.0.1:4173
      PORT: "4173"
      API_ORIGIN: http://127.0.0.1:4173
      API_SESSION_HASH_SECRET: Y2ktb25seSBzeW50aGV0aWMgc2Vzc2lvbiBoYXNoIHNlY3JldCBmb3IgZGlzcG9zYWJsZSB0ZXN0cyAzMiBieXRlcw
      API_TRUSTED_PROXY_HOPS: "0"
      API_RATE_MAX: "10000"
      API_AUTH_RATE_MAX: "1000"
      TEST_ACCOUNT_PASSWORD: ci-only-guest-transfer-test-password-2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run db:migrate --prefix web
      - run: npm run build
      - name: Start app and run PostgreSQL integration tests
        shell: bash
        run: |
          set -Eeuo pipefail
          setsid npm start --prefix web > "$RUNNER_TEMP/tournament-web.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill -TERM -- "-$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/readiness-response.json" "$RUNNER_TEMP/tournament-web.log"
          }
          trap cleanup EXIT
          ready=0
          last_http_status=000
          for _ in $(seq 1 30); do
            : > "$RUNNER_TEMP/readiness-response.json"
            last_http_status="$(curl --silent --output "$RUNNER_TEMP/readiness-response.json" --write-out '%{http_code}' "$TEST_API_ORIGIN/api/v1/health/ready" || true)"
            last_http_status="${last_http_status:-000}"
            if [[ "$last_http_status" == "200" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            health_status="$(jq -r 'if .status == "ready" or .status == "not_ready" or .status == "live" then .status else "unknown" end' "$RUNNER_TEMP/readiness-response.json" 2>/dev/null || printf 'unknown')"
            echo "::error::Application readiness failed (HTTP ${last_http_status}; sanitized health status: ${health_status}; 30 attempts). Response body and application logs were not printed or uploaded."
            exit 1
          fi
          npm run test:integration
          npm run test:security

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: tournament_e2e_test
          POSTGRES_USER: tournament_e2e
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tournament_e2e -d tournament_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      POSTGRES_URL: postgres://tournament_e2e:disposable-ci-only@localhost:5432/tournament_e2e_test
      TEST_DATABASE_NAME: tournament_e2e_test
      TEST_API_ORIGIN: http://127.0.0.1:4173
      E2E_BASE_URL: http://127.0.0.1:4173
      PORT: "4173"
      API_ORIGIN: http://127.0.0.1:4173
      API_SESSION_HASH_SECRET: Y2ktb25seSBzeW50aGV0aWMgc2Vzc2lvbiBoYXNoIHNlY3JldCBmb3IgZGlzcG9zYWJsZSB0ZXN0cyAzMiBieXRlcw
      API_TRUSTED_PROXY_HOPS: "0"
      API_RATE_MAX: "10000"
      API_AUTH_RATE_MAX: "1000"
      TEST_ACCOUNT_PASSWORD: ci-only-guest-transfer-test-password-2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run db:migrate --prefix web
      - run: npm run build
      - name: Start app and run browser E2E tests
        shell: bash
        run: |
          set -Eeuo pipefail
          setsid npm start --prefix web > "$RUNNER_TEMP/tournament-web.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill -TERM -- "-$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/readiness-response.json" "$RUNNER_TEMP/tournament-web.log"
          }
          trap cleanup EXIT
          ready=0
          last_http_status=000
          for _ in $(seq 1 30); do
            : > "$RUNNER_TEMP/readiness-response.json"
            last_http_status="$(curl --silent --output "$RUNNER_TEMP/readiness-response.json" --write-out '%{http_code}' "$E2E_BASE_URL/api/v1/health/ready" || true)"
            last_http_status="${last_http_status:-000}"
            if [[ "$last_http_status" == "200" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            health_status="$(jq -r 'if .status == "ready" or .status == "not_ready" or .status == "live" then .status else "unknown" end' "$RUNNER_TEMP/readiness-response.json" 2>/dev/null || printf 'unknown')"
            echo "::error::Application readiness failed (HTTP ${last_http_status}; sanitized health status: ${health_status}; 30 attempts). Response body and application logs were not printed or uploaded."
            exit 1
          fi
          npm run test:e2e

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run build

  security:
    name: security-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
      - name: Audit root lockfile (high severity and above)
        run: npm audit --audit-level=high

  security-tests:
    name: security-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # actions/setup-node v6.5.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:security
