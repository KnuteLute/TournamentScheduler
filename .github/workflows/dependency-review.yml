name: Dependency Review

on:
  pull_request:
    branches:
      - upgrade/tournament-v2
      - main

permissions: {}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Probe dependency graph API availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          response_file="$RUNNER_TEMP/dependency-graph-probe.json"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"

          if [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          elif [[ "$http_status" == "403" ]] && [[ "$(jq -r '.message // empty' "$response_file")" == "Forbidden" ]]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub dependency review is unsupported for this repository; using the lockfile audit fallback."
          else
            echo "::error::Dependency graph API probe failed with HTTP status ${http_status}; failing closed rather than skipping dependency security review."
            exit 1
          fi
      - name: Checkout for lockfile-audit fallback
        if: steps.dependency-graph.outputs.supported == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node for lockfile-audit fallback
        if: steps.dependency-graph.outputs.supported == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies for audit fallback
        if: steps.dependency-graph.outputs.supported == 'false'
        run: npm ci
      - name: Run high-severity lockfile audit fallback
        if: steps.dependency-graph.outputs.supported == 'false'
        run: npm audit --audit-level=high
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # actions/dependency-review-action v5.0.0
        with:
          fail-on-severity: high
