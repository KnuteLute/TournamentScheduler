openapi: 3.1.0
info:
  title: Tournament Scheduler API
  version: 1.0.0
  summary: Versioned API for managing tournament owners, players, teams, matches, and standings.
  description: |
    The API is the authoritative source for tournament state. It is designed for the
    Vue client and is independent of the existing Express/EJS page routes. All
    application endpoints are rooted at `/api/v1`. Resource identifiers are opaque
    strings; clients must not infer ownership or identity from them.
servers:
  - url: /api/v1
    description: Same-origin API
tags:
  - name: Sessions
    description: Guest and authenticated session lifecycle.
  - name: Authentication
    description: Account registration, login, and logout.
  - name: Players
    description: Owner-scoped reusable player records.
  - name: Teams
    description: Owner-scoped reusable fixed doubles rosters.
  - name: Tournaments
    description: Tournament setup and lifecycle commands.
  - name: Matches
    description: Server-generated match schedule and result commands.
  - name: Standings
    description: Read-only computed tournament standings.
security:
  - sessionCookie: []
paths:
  /sessions:
    post:
      tags: [Sessions]
      operationId: createGuestSession
      summary: Create an anonymous guest session
      description: |
        Creates an anonymous owner scope and sets a fresh opaque session cookie.
        Repeated calls intentionally rotate the session; clients should call this
        only when no usable session exists. The server stores only a hash of the
        random session secret. Guest-owned data is retained until expiration or
        explicit account transfer.
      security: []
      responses:
        '201':
          description: Guest session created.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /session:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Get the current session and owner scope
      responses:
        '200':
          description: Current authenticated or guest session.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Sessions]
      operationId: revokeSession
      summary: Revoke the current session
      description: Revokes the session and expires the cookie. Revoking a session does not delete its owner data.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Session revoked.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register an account and transfer guest data
      description: |
        Registration may be called with a guest session cookie or without a
        session. On success, the server creates an authenticated session and
        rotates the cookie. When a valid guest session was supplied, its owned
        players, teams, and tournaments are transferred atomically. Name
        collisions are resolved by retaining the account's existing player and
        team; guest tournaments and match snapshots are preserved and remain
        self-contained. No guest data is transferred if registration fails.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account and authenticated session created.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate and transfer guest data
      description: |
        On valid credentials the server rotates the session cookie. If the caller
        had a valid guest session, transfer follows the same atomic collision
        rules as registration. Invalid credentials do not disclose whether the
        username exists and do not transfer guest data.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Authenticated session established.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Log out and revoke the authenticated session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Session revoked; owned data is unchanged.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        default: { $ref: '#/components/responses/Problem' }

  /players:
    get:
      tags: [Players]
      operationId: listPlayers
      summary: List players in the current owner scope
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          description: Optional case-insensitive name search.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Owner-scoped player page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Player' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Players]
      operationId: createPlayer
      summary: Create a player
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayerInput' }
      responses:
        '201':
          description: Player created.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /players/{playerId}:
    parameters:
      - $ref: '#/components/parameters/PlayerId'
    get:
      tags: [Players]
      operationId: getPlayer
      summary: Get a player
      responses:
        '200':
          description: Player representation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Players]
      operationId: updatePlayer
      summary: Rename a player
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Player updated.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Players]
      operationId: deletePlayer
      summary: Delete a player
      description: A player referenced by a draft or active tournament/team cannot be deleted; historical tournament snapshots remain unchanged.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Player deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: List teams in the current owner scope
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Owner-scoped team page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a fixed doubles team
      description: Teams are reusable owner-scoped rosters for 2v2_fixed tournaments and contain exactly two distinct owned players.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: Team created.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Get a team
      responses:
        '200':
          description: Team representation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Teams]
      operationId: updateTeam
      summary: Rename or change a team's players
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                playerIds:
                  type: array
                  minItems: 2
                  maxItems: 2
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Team updated.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Delete a team
      description: A team used by a draft or active tournament cannot be deleted; completed tournament snapshots are retained.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Team deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }

  /tournaments:
    get:
      tags: [Tournaments]
      operationId: listTournaments
      summary: List tournaments in the current owner scope
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/TournamentStatus' }
          style: form
          explode: false
      responses:
        '200':
          description: Owner-scoped tournament page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [Tournaments]
      operationId: createTournament
      summary: Create a draft tournament
      description: |
        Creation snapshots the selected player or team names into tournament
        membership. It does not generate matches or mutate player statistics.
        For 1v1 and 2v2_rotating supply playerIds; for 2v2_fixed supply teamIds.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTournament' }
      responses:
        '201':
          description: Draft created.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
    get:
      tags: [Tournaments]
      operationId: getTournament
      summary: Get a tournament
      responses:
        '200':
          description: Tournament representation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Tournaments]
      operationId: updateDraftTournament
      summary: Update a draft tournament
      description: Only draft tournaments are editable. A started tournament's participant and mode snapshots are immutable.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TournamentPatch' }
      responses:
        '200':
          description: Draft updated.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Tournaments]
      operationId: deleteDraftTournament
      summary: Delete a draft tournament
      description: Only a draft may be deleted. Started tournaments must be cancelled or completed and remain in history.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Draft deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/start:
    post:
      tags: [Tournaments]
      operationId: startTournament
      summary: Validate and start a draft tournament
      description: |
        Atomically validates owned roster snapshots, fixes participants and mode,
        creates the initial schedule, and changes draft to active. Repeating the
        same idempotency key replays the original response; attempting a new start
        on a non-draft tournament is a conflict.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Tournament started.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/cancel:
    post:
      tags: [Tournaments]
      operationId: cancelTournament
      summary: Cancel an active tournament
      description: Cancellation is terminal, preserves recorded match history, and does not award unplayed matches.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Tournament cancelled.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/finish:
    post:
      tags: [Tournaments]
      operationId: finishTournament
      summary: Finish an active tournament
      description: Marks an active tournament completed. Unplayed scheduled matches remain unplayed and do not affect standings.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Tournament completed.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/availability:
    patch:
      tags: [Tournaments]
      operationId: updateAvailability
      summary: Set paused players in an active tournament
      description: |
        Replaces the complete paused-player set. IDs must be tournament
        participants. In rotating mode, paused players are excluded from future
        generated matches; already-created or recorded matches are not rewritten.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pausedPlayerIds]
              properties:
                pausedPlayerIds:
                  type: array
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Availability updated.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tournament' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/matches:
    get:
      tags: [Matches]
      operationId: listMatches
      summary: List tournament matches
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/MatchStatus' }
          style: form
          explode: false
      responses:
        '200':
          description: Tournament match page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/TournamentId'
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [Matches]
      operationId: getMatch
      summary: Get a match
      responses:
        '200':
          description: Match representation.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/matches/{matchId}/start:
    post:
      tags: [Matches]
      operationId: startMatch
      summary: Start a scheduled match
      description: |
        Starts a scheduled match in an active tournament and records startedAt.
        At most one match may be in progress per tournament. A match can start
        only after earlier sequence matches are completed or skipped. Starting a
        match does not affect standings.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Match started.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/matches/{matchId}/result:
    post:
      tags: [Matches]
      operationId: recordMatchResult
      summary: Record or correct a match result
      description: |
        Valid only while the tournament is active and the match is in progress
        (or completed when correcting its result). Scores are non-negative
        integers; equal scores are draws. The match completion timestamp and
        standings are committed atomically. In rotating mode, a successful result
        may append the next eligible match. The whole tournament version changes.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordResult' }
      responses:
        '200':
          description: Result recorded and standings recalculated.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema:
                type: object
                required: [match, standings]
                properties:
                  match: { $ref: '#/components/schemas/Match' }
                  standings: { $ref: '#/components/schemas/Standings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/matches/{matchId}/skip:
    post:
      tags: [Matches]
      operationId: skipMatch
      summary: Skip an unplayed match
      description: |
        Marks an unplayed match skipped without a score or standings effect. In
        rotating mode the server may append the next eligible match. Completed or
        already skipped matches cannot be skipped again under a new request key.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Match skipped.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Match' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /tournaments/{tournamentId}/standings:
    get:
      tags: [Standings]
      operationId: getStandings
      summary: Get computed standings
      description: |
        Standings are computed from completed, non-skipped match results on the
        server. There is no client-supplied standings write endpoint. In 2v2_fixed
        rows represent teams; in 1v1 and 2v2_rotating rows represent players.
        Ranking order is points (win=3, draw=1, loss=0), score difference,
        points-for, then stable participant/team name and ID.
      parameters:
        - $ref: '#/components/parameters/TournamentId'
      responses:
        '200':
          description: Current computed standings.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { schema: { type: string, const: no-cache } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Standings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ts_session
      description: |
        Secure opaque random session secret. The server stores a one-way hash,
        rotates the secret on authentication/privilege change, and never accepts
        session IDs from request bodies or URLs. Cookie attributes: Secure,
        HttpOnly, SameSite=Lax (or stricter), Path=/, no Domain. Mutations also
        require a CSRF token and same-origin validation.
  headers:
    SessionCookie:
      description: |
        Opaque session cookie. Set with Secure; HttpOnly; SameSite=Lax; Path=/;
        no Domain; and an expiry no longer than the server session lifetime.
      schema: { type: string }
    ETag:
      description: Strong entity tag for this current representation; send it verbatim in If-Match for mutation.
      schema: { type: string, pattern: '^"[A-Za-z0-9._:-]+"$' }
  parameters:
    PlayerId:
      name: playerId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MatchId:
      name: matchId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound anti-CSRF token obtained from the session bootstrap/representation.
      schema: { type: string, minLength: 32, maxLength: 256 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag from the latest GET or successful mutation response; for match commands use the current tournament ETag.
      schema: { type: string, minLength: 3, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key (recommended UUID) for this logical mutation.
      schema: { type: string, minLength: 16, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's nextCursor.
      schema: { type: string, maxLength: 512 }
  responses:
    Problem:
      description: Unexpected API error using RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Malformed request or invalid JSON.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired, or invalid session; credentials may be invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CsrfRejected:
      description: CSRF token or same-origin check failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource does not exist in the current owner scope. Foreign-owned resources are indistinguishable from missing resources.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State/lifecycle conflict, duplicate normalized name, or idempotency key reused with a different request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: If-Match is stale; fetch the latest representation before retrying.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: Mutation requires an If-Match header.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Request is syntactically valid but violates field or domain constraints.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    RateLimited:
      description: Request rate exceeded; retry after the indicated interval.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque resource identifier; never treated as proof of ownership.
    Session:
      type: object
      additionalProperties: false
      required: [kind, csrfToken, expiresAt]
      properties:
        kind: { type: string, enum: [guest, authenticated] }
        account:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Account'
        csrfToken: { type: string, minLength: 32, maxLength: 256 }
        expiresAt: { type: string, format: date-time }
    Account:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string, minLength: 3, maxLength: 64 }
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 128, format: password }
    TransferSummary:
      type: object
      additionalProperties: false
      required: [playersTransferred, teamsTransferred, tournamentsTransferred]
      properties:
        playersTransferred: { type: integer, minimum: 0 }
        teamsTransferred: { type: integer, minimum: 0 }
        tournamentsTransferred: { type: integer, minimum: 0 }
        duplicatePlayersKept: { type: integer, minimum: 0 }
        duplicateTeamsKept: { type: integer, minimum: 0 }
    AuthResult:
      type: object
      additionalProperties: false
      required: [session, transfer]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        transfer: { $ref: '#/components/schemas/TransferSummary' }
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array }
        nextCursor:
          oneOf:
            - type: 'null'
            - type: string
    Player:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlayerInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    Team:
      type: object
      additionalProperties: false
      required: [id, name, players, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 80 }
        players:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/PlayerSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TeamInput:
      type: object
      additionalProperties: false
      required: [name, playerIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        playerIds:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    PlayerSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    TournamentMode:
      type: string
      enum: [1v1, 2v2_fixed, 2v2_rotating]
    TournamentStatus:
      type: string
      enum: [draft, active, completed, cancelled]
    CreateTournament:
      oneOf:
        - type: object
          additionalProperties: false
          required: [name, mode, playerIds]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            mode: { type: string, const: 1v1 }
            playerIds:
              type: array
              minItems: 2
              uniqueItems: true
              items: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: [name, mode, teamIds]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            mode: { type: string, const: 2v2_fixed }
            teamIds:
              type: array
              minItems: 2
              uniqueItems: true
              items: { $ref: '#/components/schemas/Id' }
        - type: object
          additionalProperties: false
          required: [name, mode, playerIds]
          properties:
            name: { type: string, minLength: 1, maxLength: 100 }
            mode: { type: string, const: 2v2_rotating }
            playerIds:
              type: array
              minItems: 4
              uniqueItems: true
              items: { $ref: '#/components/schemas/Id' }
    TournamentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        playerIds:
          type: array
          minItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
        teamIds:
          type: array
          minItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    Tournament:
      type: object
      additionalProperties: false
      required: [id, name, mode, status, participants, pausedPlayerIds, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 100 }
        mode: { $ref: '#/components/schemas/TournamentMode' }
        status: { $ref: '#/components/schemas/TournamentStatus' }
        participants:
          type: array
          items: { $ref: '#/components/schemas/TournamentParticipant' }
        pausedPlayerIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
        version: { type: integer, minimum: 1 }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TournamentParticipant:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        kind: { type: string, enum: [player, team] }
        players:
          type: array
          items: { $ref: '#/components/schemas/PlayerSummary' }
    MatchStatus:
      type: string
      enum: [scheduled, in_progress, completed, skipped]
    Match:
      type: object
      additionalProperties: false
      required: [id, sequence, status, sides, version, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sequence: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/MatchStatus' }
        sides:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: '#/components/schemas/MatchSide' }
        winnerSide:
          oneOf:
            - type: 'null'
            - type: integer
              enum: [0, 1]
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    MatchSide:
      type: object
      additionalProperties: false
      required: [participantId, name, players, score]
      properties:
        participantId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        players:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/PlayerSummary' }
        score: { type: [integer, 'null'], minimum: 0 }
    RecordResult:
      type: object
      additionalProperties: false
      required: [scores]
      properties:
        scores:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: integer, minimum: 0, maximum: 1000000 }
    StandingRow:
      type: object
      additionalProperties: false
      required: [rank, participantId, name, played, wins, draws, losses, pointsFor, pointsAgainst, points, scoreDifference]
      properties:
        rank: { type: integer, minimum: 1 }
        participantId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        played: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        draws: { type: integer, minimum: 0 }
        losses: { type: integer, minimum: 0 }
        pointsFor: { type: integer, minimum: 0 }
        pointsAgainst: { type: integer, minimum: 0 }
        points: { type: integer, minimum: 0 }
        scoreDifference: { type: integer }
    Standings:
      type: object
      additionalProperties: false
      required: [tournamentId, tournamentVersion, rows, calculatedAt]
      properties:
        tournamentId: { $ref: '#/components/schemas/Id' }
        tournamentVersion: { type: integer, minimum: 1 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/StandingRow' }
        calculatedAt: { type: string, format: date-time }
    FieldError:
      type: object
      additionalProperties: false
      required: [pointer, code, message]
      properties:
        pointer: { type: string, description: 'JSON Pointer to invalid field, or empty string for a request-level error.' }
        code: { type: string, description: Stable machine-readable validation code. }
        message: { type: string }
    Problem:
      type: object
      description: RFC 9457 Problem Details; extension members may be added.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string, description: Stable machine-readable application code. }
        traceId: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
